<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper City — Sunset Syndicate</title>
<meta name="description" content="Vesper City: an original top-down open-world crime game in a neon coastal city. Traffic, crowds, carjacking, a wanted level and three story jobs.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120d1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  /* Read aloud, never shown: what the screen reader announces. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vesper City: drive, walk and shoot through a neon open-world city. WASD to move, mouse to aim, E to steal a car."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
